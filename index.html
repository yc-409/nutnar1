<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #tip {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff; padding: 8px 16px;
      border-radius: 20px; z-index: 999; font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="tip">模型載入中…</div>

  <a-scene embedded
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; colorManagement: true;"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- 標記圖：使用 Hiro 標記 -->
    <a-marker preset="hiro" id="marker">
      <a-entity id="model"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 12000; easing: linear; loop: true">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const tip = document.getElementById('tip');
    const modelEl = document.getElementById('model');

    // 從 GAS 取得 glb，轉成 Blob URL 後交給 A-Frame
    google.script.run
      .withSuccessHandler(function (b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
        modelEl.setAttribute('gltf-model', url);
        tip.textContent = '請將鏡頭對準 AR 標記圖';
      })
      .withFailureHandler(function (e) {
        tip.textContent = '模型載入失敗：' + e.message;
      })
      .getModelBase64();

    // 偵測到／離開標記時更新提示
    const marker = document.getElementById('marker');
    marker.addEventListener('markerFound', () => tip.style.display = 'none');
    marker.addEventListener('markerLost',  () => { tip.style.display = 'block'; tip.textContent = '請將鏡頭對準 AR 標記圖'; });
  </script>
</body>
</html>
